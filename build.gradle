buildscript {
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
  }
  dependencies {


  }
}

plugins {
  id 'com.diffplug.spotless' version '7.0.2' apply false
}

allprojects {
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

configure(subprojects) {
  apply plugin: 'java-library'
  apply plugin: 'com.diffplug.spotless'
  apply plugin: 'checkstyle'

  spotless {
    java {
      importOrder('java', 'javax', '', 'ca.kieve')
      trimTrailingWhitespace()
      endWithNewline()
    }
  }

  checkstyle {
    toolVersion = checkstyleVersion
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(25)
    }
  }

  // From https://lyze.dev/2021/04/29/libGDX-Internal-Assets-List/
  // The article can be helpful when using assets.txt in your project.
  tasks.register('generateAssetList') {
    inputs.dir("${project.rootDir}/assets/")
    // projectFolder/assets
    File assetsFolder = new File("${project.rootDir}/assets/")
    // projectFolder/assets/assets.txt
    File assetsFile = new File(assetsFolder, "assets.txt")
    // delete that file in case we've already created it
    assetsFile.delete()

    // iterate through all files inside that folder
    // convert it to a relative path
    // and append it to the file assets.txt
    fileTree(assetsFolder).collect { assetsFolder.relativePath(it) }.sort().each {
      assetsFile.append(it + "\n")
    }
  }
  processResources.dependsOn 'generateAssetList'

  compileJava {
    options.incremental = true
  }

  tasks.register('checkstyleFiles', Checkstyle) {
    description = 'Run Checkstyle on specific files (stub; real task is on root project)'
    classpath = files()
    source = files()
  }

  tasks.register('checkstyleChanged', Checkstyle) {
    description = 'Run Checkstyle on Java files modified in git (stub; real task is on root project)'
    classpath = files()
    source = files()
  }
}

apply plugin: 'checkstyle'

repositories {
  mavenCentral()
}

checkstyle {
  toolVersion = checkstyleVersion
  configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

tasks.register('checkstyleChanged', Checkstyle) {
  description = 'Run Checkstyle on Java files modified in git'
  group = 'verification'
  classpath = files()

  def gitStatus = ['git', 'diff', '--name-only', '--diff-filter=ACMR']
      .execute(null, rootProject.projectDir)
  def gitCached = ['git', 'diff', '--cached', '--name-only',
      '--diff-filter=ACMR']
      .execute(null, rootProject.projectDir)
  def changedFiles = (gitStatus.text.trim() + '\n'
      + gitCached.text.trim())
      .split('\n')
      .collect { it.trim() }
      .findAll { it.endsWith('.java') }
      .toUnique()
      .collect { rootProject.file(it) }
  source = changedFiles
}

tasks.register('checkstyleFiles', Checkstyle) {
  description = 'Run Checkstyle on specific files. ' +
      'Usage: ./gradlew checkstyleFiles -Pfiles=file1.java,file2.java'
  group = 'verification'
  classpath = files()
  def filesProp = project.findProperty('files') ?: ''
  def fileList = filesProp.split(',')
      .collect { it.trim() }
      .findAll { it }
      .collect { rootProject.file(it) }
  source = fileList
  doFirst {
    if (fileList.isEmpty()) {
      throw new GradleException(
          'No files specified. Use -Pfiles=file1.java,file2.java')
    }
  }
}

subprojects {
  version = "$projectVersion"
  ext.appName = 'Sea Station Silicon Substrate '
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }
}

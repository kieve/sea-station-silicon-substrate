[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

tasks.register('generateContentIndex') {
    def contentDir = new File("${projectDir}/src/main/resources/content/")
    inputs.dir(contentDir)

    doLast {
        def header = "# Auto-generated by gradle. Do not edit.\n"
        contentDir.eachDirRecurse { subDir ->
            def indexFile = new File(subDir, "file_list.txt")
            indexFile.delete()
            def yamlFiles = subDir.listFiles({ f ->
                f.isFile() && f.name.endsWith('.yaml')
            } as FileFilter)
            if (yamlFiles != null) {
                indexFile.append(header)
                yamlFiles.collect { it.name }.sort().each {
                    indexFile.append(it + "\n")
                }
            }

            def dirListFile = new File(subDir, "dir_list.txt")
            dirListFile.delete()
            def childDirs = subDir.listFiles({ f ->
                f.isDirectory()
            } as FileFilter)
            if (childDirs != null && childDirs.length > 0) {
                dirListFile.append(header)
                childDirs.collect { it.name }.sort().each {
                    dirListFile.append(it + "\n")
                }
            }
        }
    }
}
processResources.dependsOn 'generateContentIndex'

apply plugin: 'jacoco'

configurations {
  mockitoAgent
}
dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

  api "dev.dominion.ecs:dominion-ecs-engine:$dominionEcsVersion"

  api "com.squidpony:squidcore:$squidSquadVersion"
  api "com.squidpony:squidgrid:$squidSquadVersion"
  api "com.squidpony:squidplace:$squidSquadVersion"
  api "com.squidpony:squidpath:$squidSquadVersion"
  api "com.squidpony:squidsmooth:$squidSquadVersion"

  api "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jacksonVersion"
  api "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"

  testImplementation platform("org.junit:junit-bom:$junitBomVersion")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
  testImplementation "org.mockito:mockito-core:$mockitoVersion"
  testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
  testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
  testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  mockitoAgent("org.mockito:mockito-core:$mockitoVersion") {
    transitive = false
  }

  if (enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
  jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

jacoco {
  toolVersion = jacocoVersion
}

tasks.named('test') {
  finalizedBy(tasks.named('jacocoTestReport'))
}

tasks.named('jacocoTestReport') {
  dependsOn(tasks.named('test'))
  reports {
    xml.required.set(false)
    csv.required.set(false)
    html.required.set(true)
  }
}

# =============================================================================
# Base Definitions
# =============================================================================

---
# Base for all non-player entities - provides common rendering and interaction
components:
  - type: Identifier
    key: base_entity
  - type: RenderingHint
    zIndex: 1
  - type: Examinable

---
# Physics - entities that can move and participate in collision detection
components:
  - type: Identifier
    key: physics
  - type: Velocity
  - type: Collider

---
# Solid - entities that block movement
components:
  - type: Identifier
    key: solid
  - type: Solid

---
# Combatant - entities that can be attacked and take damage
components:
  - type: Identifier
    key: combatant
  - type: Health
    maxHp: 100
  - type: Attackable

---
# Socketable - entities that can be possessed/socketed into
components:
  - type: Identifier
    key: socketable
  - type: Socket
  - type: Socketable

# =============================================================================
# Game Entities
# =============================================================================

---
components:
  - type: Identifier
    key: player
  - type: TileGlyph
    glyphId: player
  - type: Descriptor
    name: Player
    description: "It's you!"
  - type: DebugRect
  - type: RenderingHint
    zIndex: 2
  - type: CameraComp
  - type: PlayerController
  - type: Speed
    val: 100
  - type: SocketPlug
  - type: Velocity
  - type: Collider
  - type: Solid
  - type: Inventory
  - type: Equipment
    weaponId: chip_claws
  - type: Health
    maxHp: 100

---
parents: [base_entity, physics]
components:
  - type: Identifier
    key: debugMover
  - type: TileGlyph
    glyphId: S
  - type: Descriptor
    name: Moving Sign
    description: "Perhaps, there's many of them?"
  - type: AiController
    behavior: wanderer

---
parents: [base_entity, physics, solid, socketable]
components:
  - type: Identifier
    key: deadMech
  - type: TileGlyph
    glyphId: M
  - type: Descriptor
    name: Mech
    description: "Beep Boop."
  - type: Health
    maxHp: 100
    hp: 0
  - type: Equipment
    weaponId: power_fist

---
parents: [base_entity, solid, combatant, socketable]
components:
  - type: Identifier
    key: trainingDummy
  - type: TileGlyph
    glyphId: T
  - type: Descriptor
    name: Training Dummy
    description: "Go on, hit me."
  - type: Collider
  - type: Health
    maxHp: 20

---
parents: [base_entity, physics, solid, combatant]
components:
  - type: Identifier
    key: aiAttacker
  - type: TileGlyph
    glyphId: A
  - type: Descriptor
    name: Attacker
    description: "A hostile attacker"
  - type: Health
    maxHp: 20
  - type: Speed
    val: 100
  - type: Equipment
    weaponId: chip_claws
  - type: AiController
    behavior: player_hunter
